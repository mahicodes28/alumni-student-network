<!DOCTYPE html>
<html>
<head>
    <title>AlumniConnect 🚀</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: white;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 20px 40px;
            background: #020617;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar button {
            background: #3b82f6;
            border: none;
            padding: 10px 15px;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        /* HERO */
        .hero {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #94a3b8;
            font-size: 18px;
        }

        .hero button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
            background: #3b82f6;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* FEATURES */
        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 50px;
            flex-wrap: wrap;
        }

        .feature-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 250px;
            text-align: center;
            transition: 0.3s;
        }

        .feature-card:hover {
            transform: translateY(-10px);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            top: 0;
            left: 0;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1e293b;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
        }

        .modal input {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
            border: none;
        }

        .modal button {
            width: 100%;
            padding: 10px;
            background: #3b82f6;
            border: none;
            color: white;
            border-radius: 6px;
        }

        .close {
            float: right;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 14px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>AlumniConnect 🚀</h2>
    <button onclick="openModal()">Login</button>
</div>

<!-- HERO -->
<div class="hero">
    <h1>Connect with Alumni</h1>
    <p>Build your network. Find mentors. Grow your career.</p>
    <button onclick="openModal()">Get Started</button>
</div>

<!-- FEATURES -->
<div class="features">
    <div class="feature-card">
        <h3>🔍 Find Alumni</h3>
        <p>Search alumni by skills and companies</p>
    </div>

    <div class="feature-card">
        <h3>📩 Mentorship</h3>
        <p>Request guidance from experienced professionals</p>
    </div>

    <div class="feature-card">
        <h3>💬 Chat</h3>
        <p>Connect and communicate in real-time</p>
    </div>
</div>

<!-- LOGIN MODAL -->
<div id="modal" class="modal">
    <div class="modal-content">

        <span class="close" onclick="closeModal()">×</span>

        <h2>Login</h2>

        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="msg" class="error"></p>

        <p>New user? <a href="register.html">Register</a></p>
    </div>
</div>

<script>
const BASE_URL = "http://127.0.0.1:5000/api";

// Auto redirect if logged in
if (localStorage.getItem("user_id")) {
    window.location.href = "dashboard.html";
}

// Modal controls
function openModal() {
    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

// Login function
async function login() {
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let msg = document.getElementById("msg");

    if (!email || !password) {
        msg.innerText = "Please fill all fields";
        return;
    }

    try {
        let res = await fetch(`${BASE_URL}/login`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ email, password })
        });

        let data = await res.json();

        if (res.ok) {
            localStorage.setItem("user_id", data.user_id);
            localStorage.setItem("role", data.role);
            localStorage.setItem("name", data.name);

            window.location.href = "dashboard.html";
        } else {
            msg.innerText = data.error;
        }

    } catch (err) {
        msg.innerText = "Server error";
    }
}
</script>

</body>
</html>
