<!DOCTYPE html>
<html>
<head>
    <title>Dashboard | AlumniConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- 🔝 NAVBAR -->
<nav class="navbar">
    <h2>AlumniConnect</h2>

    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="alumni.html">Find Alumni</a>
        <a href="chat.html">Chat</a>
        <button onclick="logout()">Logout</button>
    </div>
</nav>

<!-- 📦 MAIN LAYOUT -->
<div class="dashboard">

    <!-- 👤 SIDEBAR -->
    <div class="sidebar">
        <h3 id="username">Welcome 👋</h3>
        <p id="role"></p>

        <button id="sidebarSearchBtn" onclick="goToSearch()">🔍 Find Alumni</button>
        <button onclick="loadProfile()">👤 My Profile</button>
        <button onclick="loadRequests()">📩 Requests</button>

        <!-- 🔥 NEW ANALYTICS BUTTON -->
        <button onclick="scrollToAnalytics()">📊 Analytics</button>
    </div>

    <!-- 📊 MAIN CONTENT -->
    <div class="main">

        <h2>Dashboard</h2>

        <!-- 🔥 QUICK CARDS -->
        <div class="card-grid">
            <div id="searchCard" class="card">
                <h3>🔍 Find Alumni</h3>
                <p>Connect with professionals</p>
                <button onclick="goToSearch()">Explore</button>
            </div>

            <div class="card">
                <h3 id="requestsHeader">📩 Mentorship</h3>
                <p>Track requests</p>
                <button onclick="loadRequests()">View</button>
            </div>

            <div class="card">
                <h3>👤 Profile</h3>
                <p>Update profile</p>
                <button onclick="loadProfile()">Open</button>
            </div>
        </div>

        <!-- 📩 REQUESTS LIST SECTION -->
        <div id="requestsListSection" style="display:none; margin-top:40px;">
            <h2 id="listTitle">Requests</h2>
            <div id="requestsContainer" class="card-grid">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- 📊 ANALYTICS SECTION -->
        <div id="analytics" style="margin-top:40px;">
            <h2>📊 Mentorship Analytics</h2>

            <!-- STATS -->
            <div class="card-grid">
                <div class="card">
                    <h3>Total Requests</h3>
                    <p id="total">0</p>
                </div>

                <div class="card">
                    <h3>Engagement Score</h3>
                    <p id="score">0%</p>
                </div>

                <div class="card">
                    <h3>Insight</h3>
                    <p id="insight">---</p>
                </div>
            </div>

            <!-- CHARTS -->
            <div style="margin-top:30px;">
                <canvas id="barChart"></canvas>
            </div>

            <div style="margin-top:30px;">
                <canvas id="pieChart"></canvas>
            </div>

            <div style="margin-top:30px;">
                <canvas id="lineChart"></canvas>
            </div>
        </div>

    </div>

</div>

<script src="js/dashboard.js"></script>

<script>
function scrollToAnalytics() {
    document.getElementById("analytics").scrollIntoView({ behavior: "smooth" });
}
</script>

</body>
</html>
